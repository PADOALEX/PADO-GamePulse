name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  GAMEPULSE_DISABLE_DOTENV: '1'
  GAMEPULSE_UI_LANGUAGE: 'en'
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PADO.GamePulse.sln
      - run: dotnet build PADO.GamePulse.sln -c Release --no-restore
      - run: dotnet test PADO.GamePulse.sln -c Release --no-build --logger trx
      - run: dotnet run --project tests/GamePulse.UiChecks -c Release --no-build -- artifacts/ui-checks
      - name: Check release helpers and source archive safety
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseSupport.ps1 -TestDirectory artifacts/release-support-pwsh
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-ReleaseSupport.ps1 -TestDirectory artifacts/release-support-windows-powershell
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell release helper checks failed.' }
          ./scripts/Test-InstallerRetirement.ps1 -TestDirectory artifacts/retirement-generator
          ./scripts/Test-SourceArchive.ps1 -TestDirectory artifacts/source-archive-safety
