name: Bug report
description: Report a reproducible problem in GamePulse.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach .env, API keys, cookies, private payloads or credential-bearing URLs. Use SECURITY.md for vulnerabilities."
  - type: input
    id: environment
    attributes:
      label: App version and operating system
      placeholder: "1.0.0, Windows 11 x64, 150% display scaling"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include the visible availability state; use synthetic or permitted public examples.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or additional context
      description: Review attachments before posting; exclude keys and private profile information.
