  <text x="65" y="196" fill="#f0f5fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">GamePulse</text>
  <text x="69" y="241" fill="#b3c4d9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23">Steam Profile Explorer &amp; Gaming Analytics</text>
  <text x="69" y="284" fill="#7590ad" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" letter-spacing="1">EXPLORE PROFILES   /   COMPARE LIBRARIES   /   ANALYZE PLAYTIME</text>
