<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">PADO GamePulse</title>
  <desc id="desc">Steam Profile Explorer and Gaming Analytics. A mint pulse on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111d30"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop stop-color="#72e3bf"/>
      <stop offset="1" stop-color="#8ab7fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
